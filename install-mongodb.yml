---
- name: Install MongoDB 6.0 on 5 EC2
  hosts: mongodb
  become: true
  gather_facts: true

  tasks:
    - name: Verify Ubuntu 22.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "22.04"

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - python3-apt
        state: present
        update_cache: true

    - name: Download MongoDB GPG key
      ansible.builtin.get_url:
        url: https://pgp.mongodb.com/server-6.0.asc
        dest: /tmp/mongodb-server-6.0.asc
        mode: '0644'

    - name: Import MongoDB GPG key
      ansible.builtin.command:
        cmd: gpg --dearmor -o /usr/share/keyrings/mongodb-server-6.0.gpg /tmp/mongodb-server-6.0.asc
        creates: /usr/share/keyrings/mongodb-server-6.0.gpg

    - name: Add MongoDB repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-6.0.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse"
        filename: mongodb-org-6.0
        state: present
        update_cache: true

    - name: Install MongoDB 6.0
      ansible.builtin.apt:
        name: mongodb-org
        state: present

    - name: Enable and start MongoDB
      ansible.builtin.systemd:
        name: mongod
        enabled: true
        state: started

    - name: Check MongoDB version
      ansible.builtin.command: mongod --version
      register: mongo_version
      changed_when: false

    - name: Check MongoDB service
      ansible.builtin.command: systemctl is-active mongod
      register: mongo_service
      changed_when: false

    - name: Verify installation
      ansible.builtin.assert:
        that:
          - "'db version v6.0.' in mongo_version.stdout"
          - mongo_service.stdout == "active"

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} | {{ mongo_version.stdout_lines[0] }} | {{ mongo_service.stdout }} | PASS"
